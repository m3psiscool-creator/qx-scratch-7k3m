name: drops
# Reads the replays of recent tournaments and loads landing spots into the Dropspots tab.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Window id (empty = pick recent windows automatically)"
        required: false
      limit:
        description: "Matches to process per window"
        required: false
        default: "1000000"
      tracks:
        description: "Full replays to read per window for the Rotations tab"
        required: false
        default: "3"
      purge_from:
        description: "Move matches out of this map's chest atlas (map key, e.g. BR) and re-read them for the right one"
        required: false
      reset:
        description: "Start the window over (drops its loaded landings, finished matches and chest counts)"
        required: false
        type: boolean
        default: false
concurrency: drops
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Get the replay parser (pinned)
        run: |
          git clone https://github.com/Shiqan/FortniteReplayDecompressor parser
          git -C parser checkout 76f74c1
      - name: Build the landing tool
        run: dotnet build worker/landings/landings.csproj -c Release -o worker/landings/out -nologo -v q
      - name: Process replays
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          LANDINGS_DLL: ${{ github.workspace }}/worker/landings/out/LandingsReplayReader.dll
        run: |
          limit="${{ github.event.inputs.limit || '1000000' }}"
          if [ -n "${{ github.event.inputs.window }}" ]; then wins="${{ github.event.inputs.window }}"; else wins="$(node worker/windows.mjs 400)"; fi
          # EU and NAC windows first, then the rest (fewest landings first); every match of a window is read (in chunks of 150). The repo is public (unlimited minutes); a run stops starting work after 290 min and the next run carries on (already finished matches are skipped).
          # windows whose leaderboard Epic no longer serves fail fast and do not count.
          ok=0; good=""; tried=0; SECONDS=0
          for w in $wins; do
            [ "$SECONDS" -ge 17400 ] && break
            tried=$((tried+1))
            if STOP_AFTER_SECONDS=$((17400 - SECONDS)) node worker/run.mjs "$w" --limit "$limit" ${{ github.event.inputs.reset == 'true' && '--reset' || '' }} ${{ github.event.inputs.purge_from && format('--purge-from {0}', github.event.inputs.purge_from) || '' }}; then ok=$((ok+1)); good="$good $w"; else echo "window $w failed"; fi
          done
          # full replays of a few matches per window (the ones with the most qualifying teams): movement tracks for the Rotations tab
          n=0
          for w in $good; do
            n=$((n+1)); [ "$n" -gt 1 ] && break   # full replays are slow: one window per run keeps the Actions minutes in check
            node worker/tracks.mjs "$w" --limit "${{ github.event.inputs.tracks || '3' }}" || echo "tracks of $w failed"
          done
          # a run where nothing worked (for example the site's Epic login expired) must be red, not green
          if [ "$tried" -gt 0 ] && [ "$ok" -eq 0 ]; then echo "::error::no window could be processed (check the Epic login on the Status page)"; exit 1; fi

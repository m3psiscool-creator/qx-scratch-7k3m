<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FN Game Analyzer</title>
<meta name="description" content="Predicts the points needed for any rank in Fortnite FNCS, Cash Cup and Skin Cup windows, and turns them into a strategy.">
<link rel="stylesheet" href="/style.css">
<div class="shell">
  <aside class="side">
    <a class="logo" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--ac)"/><path d="M7 22l6-7 4 4 8-10" fill="none" stroke="var(--ac-tx)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="9" r="2.2" fill="var(--ac-tx)"/></svg>
      <span>FN <b>Game Analyzer</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="foot">Unofficial. Data from Epic's public tournament endpoints.</div>
  </aside>
  <div class="col">
    <header class="top">
      <a class="logo" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--ac)"/><path d="M7 22l6-7 4 4 8-10" fill="none" stroke="var(--ac-tx)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <div class="gsearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="gs" type="search" placeholder="Find a tournament…  name, region, class" autocomplete="off" aria-label="Find a tournament">
        <div id="gsr" class="gsr" hidden></div>
      </div>
      <span class="sp"></span>
      <label class="rgsel"><span>Region</span>
        <select id="rg" aria-label="My region"><option value="">All</option>
          <option>NAC</option><option>NAW</option><option>EU</option><option>BR</option><option>ASIA</option><option>ME</option><option>OCE</option></select></label>
      <span id="clock" class="small"></span>
      <button class="iconbtn" id="theme" title="Switch theme" aria-label="Switch theme"></button>
    </header>
    <main id="app"><div class="card">Loading…</div></main>
    <footer>Predictions are estimates, not guarantees. The Accuracy page shows how well they have done.</footer>
  </div>
</div>
<nav class="mnav" id="mnav" aria-label="Main"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
<script src="/lib.js"></script>
<script src="/strategy.js"></script>
<script src="/app.js"></script>
</html>
